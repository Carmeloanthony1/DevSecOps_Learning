name: standard Build push and Deploy
on: 
  push:
    branches: [ "master", "main" ]

jobs: 
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: login to docker hub
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push 
        uses: docker/build-push-action@v5
        with: 
          context: ./CICD_Template
          file: ./CICD_Template/dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kedaikopi:latest

  # DEPLOYMENT
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps: 
      - name: Deploy to local via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22  
          script: | 

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/kedaikopi:latest

            docker stop kedaikopi-app || true
            docker rm kedaikopi-app || true
            
            docker run -d --name kedaikopi-app -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/kedaikopi:latest

            echo "Deployment kedaikopi sukses!"
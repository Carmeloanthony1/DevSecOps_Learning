# DEPLOYMENT
  deploy:
    needs: build-and-push # akan berhasil jika build-and-push berhasil
    runs-on: ubuntu-latest
    steps: 
      - name: Deploy to local via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22  
          script: | 
            echo "Berhasil login ke server via SSH!"

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/kedaikopi:latest

            docker stop kedaikopi-app || true
            docker rm kedaikopi-app || true
            
            docker run -d --name kedaikopi-app -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/kedaikopi:latest

            echo "Deployment kedaikopi sukses!"
